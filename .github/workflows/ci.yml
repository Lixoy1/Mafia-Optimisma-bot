name: Mafia Optimisma CI

on:
  push:
    branches: [main, v3-test, weekly-stats-admin-ui, round-polish-settings]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python tools/apply_registration_hotfix.py
      - run: python tools/apply_live_game_rules_hotfix.py
      - run: python tools/apply_weekly_stats_admin_ui.py
      - run: python tools/apply_test_compat_adjustments.py
      - run: python tools/apply_optimist_ui_hotfix.py
      - run: python tools/apply_optimist_ui_semantic_compat.py
      - run: python tools/apply_optimist_ui_test_compat.py
      - run: python tools/apply_round_polish_core.py
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q mafia_optimisma tests run.py
      - run: python tests/test_core.py
      - run: python tests/test_resilience_extra.py
      - run: python tests/test_callbacks_resilience.py
      - run: python tests/test_registration_live_hotfix.py
      - run: python tests/test_live_game_rules_hotfix.py
      - run: python tests/test_rankings.py
      - run: python tests/test_optimist_ui_hotfix.py
      - run: python tests/test_round_polish_core.py
      - run: python tests/test_role_matrix.py
      - run: python tests/test_role_distribution.py
      - run: python tests/test_protocol.py
      - run: python tests/test_output_formatting.py
      - run: python tests/test_storage_sqlite.py
      - run: python tests/smoke_import.py
      - run: python tests/simulate_games.py
      - run: python tests/fuzz_restart.py
      - run: python tests/fuzz_role_interactions.py
      - name: Publish verified generated sources to staging branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/round-polish-settings'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mafia_optimisma/engine.py \
            mafia_optimisma/storage.py \
            mafia_optimisma/content.py \
            mafia_optimisma/routers_callbacks.py \
            mafia_optimisma/routers_group.py \
            mafia_optimisma/routers_private.py \
            mafia_optimisma/keyboards.py \
            mafia_optimisma/main.py \
            mafia_optimisma/rankings.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix round ending and improve random role variety'
            git push origin HEAD:round-polish-settings
          fi
