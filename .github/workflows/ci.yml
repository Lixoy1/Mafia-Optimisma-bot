name: Mafia Optimisma CI

on:
  push:
    branches: [main, v3-test, round-polish-settings, verdict-chat-fix, player-experience-upgrade]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python tools/prepare_player_experience_builder.py
      - run: python tools/apply_player_experience_upgrade.py
      - run: python tools/apply_player_experience_text_fix.py
      - run: python tools/apply_chat_controls_and_items.py
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q mafia_optimisma tests run.py
      - run: python tests/test_core.py
      - run: python tests/test_resilience_extra.py
      - run: python tests/test_callbacks_resilience.py
      - run: python tests/test_registration_live_hotfix.py
      - run: python tests/test_live_game_rules_hotfix.py
      - run: python tests/test_rankings.py
      - run: python tests/test_optimist_ui_hotfix.py
      - run: python tests/test_round_polish_core.py
      - run: python tests/test_admin_game_settings.py
      - run: python tests/test_public_verdict_hotfix.py
      - run: python tests/test_mutable_verdict_hotfix.py
      - run: python tests/test_first_time_onboarding.py
      - run: python tests/test_player_experience.py
      - run: python tests/test_chat_controls_and_items.py
      - run: python tests/test_role_matrix.py
      - run: python tests/test_role_distribution.py
      - run: python tests/test_protocol.py
      - run: python tests/test_output_formatting.py
      - run: python tests/test_storage_sqlite.py
      - run: python tests/smoke_import.py
      - run: python tests/simulate_games.py
      - run: python tests/fuzz_restart.py
      - run: python tests/fuzz_role_interactions.py
      - name: Publish verified player experience upgrade
        if: github.event_name == 'push' && github.ref == 'refs/heads/player-experience-upgrade'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mafia_optimisma/content.py mafia_optimisma/models.py mafia_optimisma/engine.py mafia_optimisma/keyboards.py mafia_optimisma/storage.py mafia_optimisma/routers_callbacks.py mafia_optimisma/routers_private.py mafia_optimisma/routers_group.py
          if ! git diff --cached --quiet; then
            git commit -m 'Upgrade player UX, chat controls and item mechanics'
            git push origin HEAD:player-experience-upgrade
          fi
