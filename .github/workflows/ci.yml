name: Mafia Optimisma CI

on:
  push:
    branches: [main, v3-test]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python tools/apply_registration_hotfix.py
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q mafia_optimisma tests run.py
      - run: python tests/test_core.py
      - run: python tests/test_resilience_extra.py
      - run: python tests/test_callbacks_resilience.py
      - run: python tests/test_registration_live_hotfix.py
      - run: python tests/test_role_matrix.py
      - run: python tests/test_role_distribution.py
      - run: python tests/test_protocol.py
      - run: python tests/test_output_formatting.py
      - run: python tests/test_storage_sqlite.py
      - run: python tests/smoke_import.py
      - run: python tests/simulate_games.py
      - run: python tests/fuzz_restart.py
      - run: python tests/fuzz_role_interactions.py
      - name: Publish verified registration hotfix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mafia_optimisma/engine.py mafia_optimisma/routers_callbacks.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix live registration timeout and first-join flow'
            git push origin HEAD:main
          fi
