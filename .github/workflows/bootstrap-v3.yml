name: Bootstrap verified v3

on:
  workflow_dispatch:
  push:
    branches: [v3-test]
    paths:
      - '.bootstrap/bundle/**'
      - '.github/workflows/bootstrap-v3.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: v3-test
          fetch-depth: 0

      - name: Rebuild and verify exact archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/bundle/chunk00 \
              .bootstrap/bundle/chunk01 \
              .bootstrap/bundle/chunk02 \
              .bootstrap/bundle/chunk03 \
              .bootstrap/bundle/chunk04 > /tmp/mafia_v3_a3.b64
          base64 -d /tmp/mafia_v3_a3.b64 > /tmp/mafia_v3_a3.tar.xz
          echo "79d1e979d888507b35cae2c9b88226656d03c1beaf80ddf73b61386738af03e3  /tmp/mafia_v3_a3.tar.xz" | sha256sum -c -
          mkdir -p /tmp/extract
          tar -xJf /tmp/mafia_v3_a3.tar.xz -C /tmp/extract
          grep -Fx '__version__ = "0.3.0a3"' /tmp/extract/mafia_optimisma/__init__.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: /tmp/extract/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r /tmp/extract/requirements.txt

      - name: Compile
        run: |
          cd /tmp/extract
          python -m compileall -q mafia_optimisma tests run.py

      - name: Core tests
        run: |
          cd /tmp/extract
          python tests/test_core.py

      - name: Resilience tests
        run: |
          cd /tmp/extract
          python tests/test_resilience_extra.py
          python tests/test_callbacks_resilience.py

      - name: Role tests
        run: |
          cd /tmp/extract
          python tests/test_role_matrix.py
          python tests/test_role_distribution.py
          python tests/fuzz_role_interactions.py

      - name: Protocol and output tests
        run: |
          cd /tmp/extract
          python tests/test_output_formatting.py
          python tests/test_protocol.py

      - name: SQLite and import smoke
        run: |
          cd /tmp/extract
          python tests/test_storage_sqlite.py
          python tests/smoke_import.py

      - name: Headless game simulations
        run: |
          cd /tmp/extract
          python tests/simulate_games.py
          python tests/fuzz_restart.py

      - name: Publish exact verified build to v3-test
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/extract/. .
          rm -f .github/workflows/bootstrap-v3.yml
          git config user.name "Mafia Optimisma CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Mafia Optimisma v3 0.3.0a3 (verified)"
          git push origin HEAD:v3-test
