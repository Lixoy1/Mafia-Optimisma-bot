name: Bootstrap Mafia Optimisma v3

on:
  workflow_dispatch:
  push:
    branches: [v3-test]
    paths:
      - '.github/workflows/bootstrap-v3.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-test
          fetch-depth: 0

      - name: Assemble, verify, test and publish v3
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/parts/part-00 ]; then
            echo 'v3 already bootstrapped; nothing to publish'
            exit 0
          fi
          cat \
            .bootstrap/parts/part-00 \
            .bootstrap/parts/part-01 \
            .bootstrap/final/p2-0 \
            .bootstrap/final/p2-1 \
            .bootstrap/final/p2-2 \
            .bootstrap/final/p2-3 \
            .bootstrap/final/p2-4a \
            .bootstrap/final/p2-4b \
            .bootstrap/final/p2-5a \
            .bootstrap/final/p2-5b \
            .bootstrap/parts/part-03 \
            .bootstrap/parts/part-04 \
            .bootstrap/parts/part-05 \
            .bootstrap/final/part-06 \
            .bootstrap/parts/part-07 \
            .bootstrap/parts/part-08 \
            .bootstrap/parts/part-09 \
            .bootstrap/final/part-10 \
            .bootstrap/final/part-11 \
            .bootstrap/final/part-12 > /tmp/mafia_v3.b64
          base64 --decode /tmp/mafia_v3.b64 > /tmp/mafia_v3.zip
          echo '5118eef5d520e97cfaa77a553f4f9badccfcf5d088462d587663e8f62a3b3f93  /tmp/mafia_v3.zip' | sha256sum -c -
          rm -rf /tmp/mafia-v3-unpack && mkdir -p /tmp/mafia-v3-unpack
          unzip -q /tmp/mafia_v3.zip -d /tmp/mafia-v3-unpack
          grep -Fx '__version__ = "0.3.0a3"' /tmp/mafia-v3-unpack/mafia_optimisma_v3/mafia_optimisma/__init__.py
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/mafia-v3-unpack/mafia_optimisma_v3/requirements.txt
          cd /tmp/mafia-v3-unpack/mafia_optimisma_v3
          python -m compileall -q mafia_optimisma tests run.py
          python tests/test_core.py
          python tests/test_resilience_extra.py
          python tests/test_callbacks_resilience.py
          python tests/test_role_matrix.py
          python tests/test_role_distribution.py
          python tests/test_protocol.py
          python tests/test_output_formatting.py
          python tests/test_storage_sqlite.py
          python tests/smoke_import.py
          python tests/simulate_games.py
          python tests/fuzz_restart.py
          python tests/fuzz_role_interactions.py
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/mafia-v3-unpack/mafia_optimisma_v3/. .
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install tested Mafia Optimisma v3 0.3.0a3'
          git push origin HEAD:v3-test
